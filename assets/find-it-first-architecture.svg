<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" role="img" aria-labelledby="title description">
  <title id="title">Find It First AWS serverless architecture</title>
  <desc id="description">Student browser connects to an app hosted on AWS Amplify, Amazon Cognito for authentication, Amazon API Gateway and AWS Lambda functions. Lambda reads and writes to DynamoDB and stores private photos in Amazon S3.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#46615f"/>
    </marker>
    <style>
      .title{font:700 22px Arial,sans-serif;fill:#1d1c19}
      .subtitle{font:14px Arial,sans-serif;fill:#6b675c}
      .label{font:700 15px Arial,sans-serif;fill:#1d1c19}
      .detail{font:13px Arial,sans-serif;fill:#56534b}
      .edge-label{font:12px Arial,sans-serif;fill:#56534b}
      .node{fill:#fffefa;stroke:#9b988e;stroke-width:1.5}
      .edge{fill:none;stroke:#46615f;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="670" fill="#fff"/>
  <text class="title" x="30" y="34">FIND IT FIRST</text>
  <text class="subtitle" x="30" y="58">Serverless architecture on AWS</text>

  <rect x="220" y="72" width="950" height="535" rx="18" fill="#fbf9f3" stroke="#8c9a96" stroke-width="2" stroke-dasharray="9 7"/>
  <text class="label" x="244" y="102">AWS CLOUD · EU-WEST-1</text>
  <text class="subtitle" x="885" y="102">No servers to manage · pay per request</text>

  <rect class="node" x="28" y="195" width="150" height="190" rx="14"/>
  <text class="label" x="103" y="270" text-anchor="middle">Student</text>
  <text class="detail" x="103" y="295" text-anchor="middle">Phone browser</text>
  <text class="detail" x="103" y="320" text-anchor="middle">Search · claim</text>
  <text class="detail" x="103" y="341" text-anchor="middle">Upload photo</text>

  <rect class="node" x="270" y="132" width="205" height="88" rx="12"/>
  <text class="label" x="372" y="168" text-anchor="middle">AWS Amplify Hosting</text>
  <text class="detail" x="372" y="192" text-anchor="middle">React app · static files</text>

  <rect class="node" x="270" y="284" width="205" height="105" rx="12"/>
  <text class="label" x="372" y="320" text-anchor="middle">Amazon Cognito</text>
  <text class="detail" x="372" y="345" text-anchor="middle">User pool · email sign-in</text>
  <text class="detail" x="372" y="367" text-anchor="middle">JWT authorization</text>

  <rect class="node" x="270" y="455" width="205" height="105" rx="12"/>
  <text class="label" x="372" y="493" text-anchor="middle">Amazon API Gateway</text>
  <text class="detail" x="372" y="519" text-anchor="middle">HTTP API</text>
  <text class="detail" x="372" y="540" text-anchor="middle">JWT authorizer · throttling</text>

  <rect class="node" x="555" y="284" width="220" height="105" rx="12"/>
  <text class="label" x="665" y="320" text-anchor="middle">AWS Lambda</text>
  <text class="detail" x="665" y="345" text-anchor="middle">Pre-sign-up check</text>
  <text class="detail" x="665" y="367" text-anchor="middle">University emails only</text>

  <rect class="node" x="555" y="430" width="220" height="135" rx="12"/>
  <text class="label" x="665" y="462" text-anchor="middle">AWS Lambda · Node.js 22</text>
  <text class="detail" x="665" y="487" text-anchor="middle">8 API functions</text>
  <text class="detail" x="665" y="509" text-anchor="middle">Items · claims · decisions</text>
  <text class="detail" x="665" y="531" text-anchor="middle">Uploads · activity · returns</text>

  <rect class="node" x="900" y="416" width="220" height="82" rx="12"/>
  <text class="label" x="1010" y="450" text-anchor="middle">Amazon DynamoDB</text>
  <text class="detail" x="1010" y="475" text-anchor="middle">Items · claims · on-demand</text>

  <rect class="node" x="900" y="515" width="220" height="70" rx="12"/>
  <text class="label" x="1010" y="545" text-anchor="middle">Amazon S3</text>
  <text class="detail" x="1010" y="566" text-anchor="middle">Private photos</text>

  <path class="edge" d="M178 225H222V176H270"/>
  <text class="edge-label" x="196" y="214">load app</text>
  <path class="edge" d="M178 280H225V336H270"/>
  <text class="edge-label" x="190" y="270">sign in</text>
  <path class="edge" d="M178 350H225V507H270"/>
  <text class="edge-label" x="190" y="400">API calls</text>
  <path class="edge" d="M475 336H555"/>
  <text class="edge-label" x="487" y="326">domain check</text>
  <path class="edge" d="M475 507H555"/>
  <text class="edge-label" x="497" y="497">invoke</text>
  <path class="edge" d="M775 465H840V457H900"/>
  <text class="edge-label" x="793" y="448">read / write</text>
  <path class="edge" d="M775 530H840V550H900"/>
  <text class="edge-label" x="790" y="520">photo links</text>
  <path class="edge" d="M103 385V630H1010V585"/>
  <text class="edge-label" x="420" y="624">Direct photo upload · max 600 KB</text>
</svg>
